<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5b5"/>
      <stop offset="100%" stop-color="#f5efe4"/>
    </linearGradient>
    <pattern id="deck" width="30" height="8" patternUnits="userSpaceOnUse">
      <rect width="30" height="8" fill="#e8dcc8"/>
      <line x1="0" y1="8" x2="30" y2="8" stroke="#d4c4a8" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="850" fill="url(#sky)"/>
  <rect x="40" y="40" width="1120" height="720" fill="url(#deck)" stroke="#2c2416" stroke-width="2"/>

  <!-- Title -->
  <rect x="40" y="770" width="1120" height="60" fill="#2c2416"/>
  <text x="60" y="798" fill="#f5e6c8" font-size="16" font-weight="bold">DUBAI PREMIUM HOOKAH LOUNGE  ROOFTOP LEVEL FLOOR PLAN</text>
  <text x="60" y="818" fill="#c9b896" font-size="11">28 lounge seats · Pergola canopy · Reflective linear ceiling lighting · Robot service via lift/handoff</text>
  <text x="980" y="805" fill="#f5e6c8" font-size="11">DRAWING A-02</text>

  <!-- Perimeter parapet -->
  <rect x="55" y="55" width="1090" height="690" fill="none" stroke="#5a4a32" stroke-width="8" opacity="0.4"/>
  <text x="600" y="75" text-anchor="middle" font-size="9" fill="#5a4a32">PARAPET / WIND SCREEN</text>

  <!-- Pergola / canopy zone -->
  <rect x="100" y="100" width="780" height="520" fill="#f0e8d8" fill-opacity="0.5" stroke="#8B7355" stroke-width="2" stroke-dasharray="12,6"/>
  <text x="490" y="130" text-anchor="middle" font-size="14" fill="#2c2416" font-weight="bold">ROOFTOP LOUNGE · 28 SEATS</text>
  <text x="490" y="148" text-anchor="middle" font-size="10" fill="#6a5a42">Retractable pergola · reflective linear ceiling lighting (luxury automotive-inspired)</text>

  <!-- Ceiling lighting strips indicated -->
  <g opacity="0.6">
    <line x1="140" y1="170" x2="840" y2="170" stroke="#c9a96e" stroke-width="3"/>
    <line x1="140" y1="200" x2="840" y2="200" stroke="#c9a96e" stroke-width="2"/>
    <line x1="140" y1="230" x2="840" y2="230" stroke="#c9a96e" stroke-width="3"/>
    <text x="860" y="200" font-size="8" fill="#c9a96e">CEILING LIGHT STRIPS</text>
  </g>

  <!-- Lounge booths row 1 -->
  <g id="rooftop-seating">
    <!-- Booth cluster left -->
    <rect x="140" y="260" width="100" height="80" rx="8" fill="#c4a882" stroke="#2c2416" stroke-width="1.5"/>
    <ellipse cx="170" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="210" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="170" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="210" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="190" y="255" text-anchor="middle" font-size="9" fill="#2c2416">R1 · 4p</text>

    <rect x="270" y="260" width="100" height="80" rx="8" fill="#c4a882" stroke="#2c2416" stroke-width="1.5"/>
    <ellipse cx="300" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="340" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="300" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="340" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="320" y="255" text-anchor="middle" font-size="9" fill="#2c2416">R2 · 4p</text>

    <rect x="400" y="260" width="100" height="80" rx="8" fill="#c4a882" stroke="#2c2416" stroke-width="1.5"/>
    <ellipse cx="430" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="470" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="430" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="470" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="450" y="255" text-anchor="middle" font-size="9" fill="#2c2416">R3 · 4p</text>

    <rect x="530" y="260" width="100" height="80" rx="8" fill="#c4a882" stroke="#2c2416" stroke-width="1.5"/>
    <ellipse cx="560" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="600" cy="290" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="560" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <ellipse cx="600" cy="320" rx="20" ry="14" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="580" y="255" text-anchor="middle" font-size="9" fill="#2c2416">R4 · 4p</text>

    <!-- Center low tables -->
    <rect x="200" y="400" width="80" height="55" rx="6" fill="#fff" stroke="#2c2416"/>
    <circle cx="220" cy="395" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="260" cy="395" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="220" cy="460" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="260" cy="460" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="240" y="432" text-anchor="middle" font-size="9">R5</text>

    <rect x="320" y="400" width="80" height="55" rx="6" fill="#fff" stroke="#2c2416"/>
    <circle cx="340" cy="395" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="380" cy="395" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="340" cy="460" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="380" cy="460" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="360" y="432" text-anchor="middle" font-size="9">R6</text>

    <rect x="440" y="400" width="80" height="55" rx="6" fill="#fff" stroke="#2c2416"/>
    <circle cx="460" cy="395" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="500" cy="395" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="460" cy="460" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="500" cy="460" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="480" y="432" text-anchor="middle" font-size="9">R7</text>

    <rect x="560" y="400" width="60" height="45" rx="6" fill="#fff" stroke="#2c2416"/>
    <circle cx="575" cy="395" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <circle cx="605" cy="450" r="6" fill="#d4c4a8" stroke="#2c2416"/>
    <text x="590" y="425" text-anchor="middle" font-size="9">R8</text>
  </g>

  <!-- Robot aisle on rooftop -->
  <path d="M680 180 L680 560 L160 560" stroke="#8B4513" stroke-width="3" stroke-dasharray="10,6" fill="none" opacity="0.75"/>
  <text x="700" y="200" font-size="9" fill="#8B4513" font-weight="bold">ROBOT AISLE</text>

  <!-- Robot on rooftop -->
  <g transform="translate(665,350)">
    <rect width="30" height="24" rx="4" fill="#fff" stroke="#8B4513" stroke-width="1.5"/>
    <circle cx="8" cy="26" r="3" fill="#2c2416"/>
    <circle cx="22" cy="26" r="3" fill="#2c2416"/>
    <rect x="6" y="5" width="18" height="12" rx="1" fill="#c9a96e"/>
    <text x="15" y="-6" text-anchor="middle" font-size="8" fill="#8B4513">R4</text>
  </g>

  <!-- BAR / SERVICE HANDOFF -->
  <rect x="700" y="260" width="150" height="180" fill="#e8dcc8" stroke="#2c2416" stroke-width="2"/>
  <text x="775" y="295" text-anchor="middle" font-size="12" fill="#2c2416" font-weight="bold">ROOFTOP BAR</text>
  <text x="775" y="315" text-anchor="middle" font-size="9" fill="#6a5a42">&amp; HANDOFF COUNTER</text>
  <rect x="720" y="340" width="110" height="50" fill="#c9a96e" stroke="#2c2416"/>
  <text x="775" y="370" text-anchor="middle" font-size="10" fill="#2c2416">BAR TOP</text>
  <rect x="720" y="400" width="110" height="25" fill="#f0e0c8" stroke="#8B4513" stroke-width="1.5"/>
  <text x="775" y="417" text-anchor="middle" font-size="8" fill="#8B4513">ROBOT PICKUP</text>

  <!-- STAIRS / LIFT core -->
  <rect x="900" y="260" width="200" height="200" fill="#d8d0c0" stroke="#2c2416" stroke-width="2"/>
  <text x="1000" y="310" text-anchor="middle" font-size="12" fill="#2c2416" font-weight="bold">CORE</text>
  <text x="1000" y="330" text-anchor="middle" font-size="10" fill="#6a5a42">STAIRS + LIFT</text>
  <text x="1000" y="348" text-anchor="middle" font-size="9" fill="#6a5a42">from Indoor</text>
  <rect x="940" y="370" width="50" height="60" fill="#c0b8a8" stroke="#2c2416"/>
  <text x="965" y="405" text-anchor="middle" font-size="9">LIFT</text>
  <g>
    <line x1="1020" y1="370" x2="1070" y2="370" stroke="#2c2416"/>
    <line x1="1020" y1="385" x2="1070" y2="385" stroke="#2c2416"/>
    <line x1="1020" y1="400" x2="1070" y2="400" stroke="#2c2416"/>
    <line x1="1020" y1="415" x2="1070" y2="415" stroke="#2c2416"/>
    <text x="1045" y="440" text-anchor="middle" font-size="8">STAIR</text>
  </g>

  <!-- Exhaust stacks -->
  <rect x="900" y="100" width="80" height="100" fill="#a88860" stroke="#8B0000" stroke-width="2"/>
  <text x="940" y="140" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">EXHAUST</text>
  <text x="940" y="155" text-anchor="middle" font-size="8" fill="#fff">STACKS</text>
  <text x="940" y="175" text-anchor="middle" font-size="8" fill="#5a3020">from coal room</text>
  <circle cx="920" cy="120" r="8" fill="#5a3020"/>
  <circle cx="960" cy="120" r="8" fill="#5a3020"/>

  <!-- MEP plant -->
  <rect x="1000" y="100" width="100" height="100" fill="#b0a898" stroke="#2c2416" stroke-width="1.5"/>
  <text x="1050" y="145" text-anchor="middle" font-size="10" fill="#2c2416" font-weight="bold">MEP</text>
  <text x="1050" y="162" text-anchor="middle" font-size="8" fill="#2c2416">AHU / FANS</text>

  <!-- Edge view / skyline note -->
  <rect x="100" y="640" width="780" height="80" fill="#2c2416" opacity="0.15"/>
  <text x="490" y="685" text-anchor="middle" font-size="12" fill="#2c2416" font-weight="bold">SKYLINE VIEW EDGE · DUBAI</text>
  <text x="490" y="705" text-anchor="middle" font-size="9" fill="#5a4a32">Glass wind screen · low planting · no solid wall blocking view</text>

  <!-- E-shisha note rooftop -->
  <rect x="140" y="500" width="200" height="40" fill="#ede4d4" stroke="#2c2416" stroke-dasharray="4,2"/>
  <text x="240" y="525" text-anchor="middle" font-size="9" fill="#2c2416">E-SHISHA PERMITTED (rooftop)</text>

  <!-- Legend -->
  <rect x="920" y="500" width="180" height="180" fill="#fff" stroke="#2c2416" opacity="0.95"/>
  <text x="1010" y="525" text-anchor="middle" font-size="11" font-weight="bold">SEAT SUMMARY</text>
  <text x="940" y="555" font-size="10" fill="#2c2416">Rooftop lounge: 28</text>
  <text x="940" y="575" font-size="10" fill="#2c2416">Indoor dining: 22</text>
  <text x="940" y="595" font-size="10" fill="#2c2416">TOTAL: 50 seats</text>
  <text x="940" y="625" font-size="9" fill="#8B4513">Robots: 4 units</text>
  <text x="940" y="645" font-size="9" fill="#8B4513">Indoor 3 + Rooftop 1</text>
  <text x="940" y="665" font-size="8" fill="#6a5a42">(rooftop via lift handoff)</text>

  <!-- North -->
  <g transform="translate(80,120)">
    <polygon points="0,-18 7,8 -7,8" fill="#2c2416"/>
    <text x="0" y="24" text-anchor="middle" font-size="10" font-weight="bold">N</text>
  </g>

  <!-- ROOFTOP VIP-2 add-on -->
  <rect x="60" y="620" width="280" height="120" fill="#3a1528" stroke="#FF2D95" stroke-width="2.5"/>
  <text x="200" y="655" text-anchor="middle" font-size="12" fill="#FF69B4" font-weight="bold">ROOFTOP VIP-2</text>
  <text x="200" y="675" text-anchor="middle" font-size="9" fill="#D4AF37">e-locked terrace · see A-07</text>
  <text x="200" y="695" text-anchor="middle" font-size="9" fill="#FFB6D9">8 seats · fireplace · R4 pass</text>
  <text x="200" y="720" text-anchor="middle" font-size="8" fill="#FFE08A">replaces 8 general seats when booked</text>
</svg>
