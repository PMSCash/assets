  <rect x="80" y="730" width="600" height="140" fill="#120816" stroke="#D4AF37"/>
  <text x="100" y="760" fill="#FFE08A" font-size="12" font-weight="bold">SEAT CHECK</text>
  <text x="100" y="790" fill="#FFB6D9" font-size="11">Rooftop 28 + indoor dining 10 + e-shisha 4 + VIP-1 (counted in indoor 22) = 50 design seats</text>
  <text x="100" y="815" fill="#FFB6D9" font-size="11">VIP-2 rooftop is an add-on booking (8 seats)  may share rooftop capacity or expand total</text>
  <text x="100" y="840" fill="#D4AF37" font-size="11">Recommend: VIP-2 replaces 8 of the 28 general rooftop seats when booked</text>

  <rect x="720" y="730" width="600" height="140" fill="#120816" stroke="#FF2D95"/>
  <text x="740" y="760" fill="#FF69B4" font-size="12" font-weight="bold">FINISH STANDARD</text>
  <text x="740" y="790" fill="#FFB6D9" font-size="11">Palette: pink #FF2D95 / #FF69B4 · gold #D4AF37 · near-black #120816</text>
  <text x="740" y="815" fill="#FFB6D9" font-size="11">Metals: brushed gold + chrome pole · soft goods: velvet / performance outdoor</text>
  <text x="740" y="840" fill="#D4AF37" font-size="11">EJL logo on robots, VIP plaques, tray liners, staff closet tags</text>
