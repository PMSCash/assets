<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1400" height="1000" fill="#1a0f16"/>
  <rect x="40" y="40" width="1320" height="860" fill="#2a1524" stroke="#D4AF37" stroke-width="2"/>

