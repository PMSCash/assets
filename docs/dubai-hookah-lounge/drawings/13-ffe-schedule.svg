    <rect x="80" y="288" width="1240" height="28" fill="#321828"/><text x="100" y="307" fill="#fff">VIP-1 banquettes / seats</text><text x="520" y="307">Indoor VIP-1</text><text x="780" y="307" fill="#FFE08A" font-weight="bold">810</text><text x="920" y="307">Pink/gold</text>
