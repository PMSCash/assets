  <rect x="900" y="250" width="22" height="90" rx="2" fill="#120816" stroke="#D4AF37"/>
  <text x="911" y="300" text-anchor="middle" font-size="7" fill="#FF69B4" transform="rotate(-90 911 295)">TV-3</text>

