  <circle cx="415" cy="360" r="8" fill="#D4AF37"/><circle cx="415" cy="420" r="8" fill="#D4AF37"/>
  <circle cx="835" cy="240" r="8" fill="#D4AF37"/><circle cx="835" cy="300" r="8" fill="#D4AF37"/>
  <circle cx="835" cy="360" r="8" fill="#D4AF37"/><circle cx="835" cy="420" r="8" fill="#D4AF37"/>
  <circle cx="520" cy="175" r="8" fill="#D4AF37"/><circle cx="640" cy="175" r="8" fill="#D4AF37"/>
