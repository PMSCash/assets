  <rect x="380" y="200" width="70" height="280" rx="8" fill="#6a3058" stroke="#D4AF37" opacity="0.9"/>
  <rect x="800" y="200" width="70" height="280" rx="8" fill="#6a3058" stroke="#D4AF37" opacity="0.9"/>
  <rect x="470" y="160" width="300" height="55" rx="8" fill="#6a3058" stroke="#D4AF37" opacity="0.9"/>
