  <rect x="380" y="570" width="150" height="130" fill="#4a2840" stroke="#FF2D95" stroke-width="2"/>
  <text x="455" y="605" text-anchor="middle" font-size="11" fill="#FF69B4" font-weight="bold">HOSTESS</text>
