  <text x="455" y="642" text-anchor="middle" font-size="9" fill="#FFB6D9">e-pay assist · cloak</text>
  <circle cx="430" cy="670" r="8" fill="#D4AF37"/><rect x="423" y="678" width="14" height="18" rx="3" fill="#FF2D95"/>
  <circle cx="480" cy="670" r="8" fill="#D4AF37"/><rect x="473" y="678" width="14" height="18" rx="3" fill="#FF2D95"/>

  <rect x="550" y="570" width="120" height="130" fill="#3a3040" stroke="#D4AF37"/>
  <text x="610" y="630" text-anchor="middle" font-size="11" fill="#FFE08A" font-weight="bold">PRIVATE WC</text>
  <text x="610" y="650" text-anchor="middle" font-size="9" fill="#FFB6D9">ensuite 6 m²</text>

  <rect x="690" y="570" width="180" height="130" fill="#4a2840" stroke="#D4AF37" stroke-width="2"/>
  <text x="780" y="610" text-anchor="middle" font-size="11" fill="#D4AF37" font-weight="bold">SERVICE PASS</text>
  <text x="780" y="630" text-anchor="middle" font-size="9" fill="#FFB6D9">EJL robot ? pass only</text>
  <rect x="720" y="650" width="120" height="28" fill="#120816" stroke="#FF2D95"/>
  <text x="780" y="668" text-anchor="middle" font-size="9" fill="#FF69B4">PASS WINDOW</text>

  <!-- Side panel -->
  <rect x="960" y="70" width="180" height="660" fill="#120816" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="1050" y="105" text-anchor="middle" font-size="12" fill="#FF69B4" font-weight="bold">EJL VIP OPS</text>

  <!-- Mini logo mark -->
  <circle cx="1050" cy="155" r="28" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="1050" y="150" text-anchor="middle" font-size="14" fill="#FF2D95" font-weight="bold">EJL</text>
  <text x="1050" y="168" text-anchor="middle" font-size="7" fill="#D4AF37">LIGHTHOUSE</text>

  <text x="980" y="210" font-size="10" fill="#FFE08A" font-weight="bold">Must-have features</text>
  <text x="980" y="230" font-size="9" fill="#FFB6D9">• Indoor fountain</text>
  <text x="980" y="248" font-size="9" fill="#FFB6D9">• Gas fireplace</text>
  <text x="980" y="266" font-size="9" fill="#FFB6D9">• Pole dance stage</text>
  <text x="980" y="284" font-size="9" fill="#FFB6D9">• 3× TVs + VOD</text>
  <text x="980" y="302" font-size="9" fill="#FFB6D9">• E-door locked</text>
  <text x="980" y="320" font-size="9" fill="#FFB6D9">• Hostess ×2</text>

  <text x="980" y="355" font-size="10" fill="#FFE08A" font-weight="bold">Safety</text>
  <text x="980" y="375" font-size="9" fill="#FFB6D9">• Soft floor at pole</text>
  <text x="980" y="393" font-size="9" fill="#FFB6D9">• Fireplace guard</text>
  <text x="980" y="411" font-size="9" fill="#FFB6D9">• Fountain keep-out</text>
  <text x="980" y="429" font-size="9" fill="#FFB6D9">• Panic ? emerg. room</text>

  <text x="980" y="465" font-size="10" fill="#FFE08A" font-weight="bold">Pay</text>
  <text x="980" y="485" font-size="9" fill="#FFB6D9">• Electronic only</text>
  <text x="980" y="503" font-size="9" fill="#FFB6D9">• No tipping</text>
  <text x="980" y="521" font-size="9" fill="#FFB6D9">• Donations only</text>

  <text x="980" y="555" font-size="10" fill="#FFE08A" font-weight="bold">Branding</text>
  <text x="980" y="575" font-size="9" fill="#FFB6D9">• Pink + gold EJL</text>
  <text x="980" y="593" font-size="9" fill="#FFB6D9">• Logo on robots</text>
  <text x="980" y="611" font-size="9" fill="#FFB6D9">• Suite plaque</text>

  <text x="1050" y="680" text-anchor="middle" font-size="9" fill="#FF2D95" font-weight="bold">PRIVACY MODE ON</text>

  <!-- Legend -->
  <rect x="60" y="70" width="150" height="170" fill="#120816" stroke="#D4AF37"/>
  <text x="135" y="95" text-anchor="middle" font-size="10" fill="#FF69B4" font-weight="bold">LEGEND</text>
  <ellipse cx="85" cy="120" rx="10" ry="7" fill="#3a6a8a" stroke="#7ec8e3"/>
  <text x="105" y="124" font-size="8" fill="#FFE08A">Fountain</text>
  <rect x="75" y="140" width="16" height="14" fill="#FF2D95" stroke="#D4AF37"/>
  <text x="105" y="151" font-size="8" fill="#FFE08A">Fireplace</text>
  <circle cx="83" cy="175" r="8" fill="#4a2040" stroke="#FF2D95"/>
  <text x="105" y="179" font-size="8" fill="#FFE08A">Pole stage</text>
  <circle cx="83" cy="205" r="5" fill="#D4AF37"/>
  <text x="105" y="209" font-size="8" fill="#FFE08A">Seat</text>
