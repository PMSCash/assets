<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0d0e0" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4"/><stop offset="100%" stop-color="#FF2D95"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A"/><stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FF2D95"/>
    </marker>
  </defs>

  <rect width="1200" height="850" fill="#1a0f16"/>
  <rect x="40" y="40" width="1120" height="720" fill="#2a1524" stroke="#D4AF37" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="720" fill="url(#grid)" opacity="0.35"/>

  <!-- Title -->
  <rect x="40" y="770" width="1120" height="60" fill="#120816"/>
  <text x="60" y="798" fill="#FF69B4" font-size="16" font-weight="bold">EJL LIGHTHOUSE — VIP SUITE PLAN</text>
  <text x="60" y="818" fill="#D4AF37" font-size="11">E-locked · indoor fountain · fireplace · pole dance · TVs/VOD · hostesses · e-shisha · no tip e-pay</text>
  <text x="980" y="805" fill="#FF69B4" font-size="11">DRAWING A-04</text>

  <!-- Corridor -->
