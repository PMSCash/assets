  <rect x="310" y="360" width="18" height="80" fill="#120816" stroke="#FF2D95" stroke-width="2"/>
  <rect x="314" y="390" width="10" height="20" rx="2" fill="#2ecc71"/>
  <text x="319" y="350" text-anchor="middle" font-size="8" fill="#FF69B4" font-weight="bold">E-DOOR</text>
  <text x="319" y="455" text-anchor="middle" font-size="7" fill="#2ecc71">LOCKED</text>
  <rect x="250" y="380" width="36" height="48" rx="3" fill="#120816" stroke="#D4AF37"/>
  <circle cx="268" cy="416" r="4" fill="#2ecc71"/>
  <text x="268" y="440" text-anchor="middle" font-size="7" fill="#FFE08A">RFID</text>

  <line x1="330" y1="400" x2="370" y2="400" stroke="#FF2D95" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VIP suite -->
  <rect x="350" y="70" width="580" height="660" fill="#321828" stroke="#FF2D95" stroke-width="3"/>
  <text x="640" y="100" text-anchor="middle" font-size="16" fill="#FF69B4" font-weight="bold">EJL LIGHTHOUSE VIP · ELECTRONICALLY CLOSED</text>
  <text x="640" y="120" text-anchor="middle" font-size="11" fill="#D4AF37">~50 m² · fountain · fireplace · pole · 3 TVs · hostesses</text>

