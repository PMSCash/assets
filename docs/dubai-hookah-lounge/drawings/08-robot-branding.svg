<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/><stop offset="100%" stop-color="#FF2D95"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A"/><stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="850" fill="#120816"/>
  <rect x="40" y="40" width="1120" height="720" fill="#1a0f16" stroke="#D4AF37" stroke-width="2"/>

  <rect x="40" y="770" width="1120" height="60" fill="#0a0610"/>
  <text x="60" y="798" fill="#FF69B4" font-size="16" font-weight="bold">EJL LIGHTHOUSE  ROBOT FLEET BRANDING</text>
  <text x="60" y="818" fill="#D4AF37" font-size="11">Pink + gold logo tagged on every delivery robot · no tip · electronic pay · VIP pass handoff</text>
  <text x="980" y="805" fill="#FF69B4" font-size="11">DRAWING B-01</text>

  <text x="600" y="100" text-anchor="middle" font-size="22" fill="#FF69B4" font-weight="bold">EJL LIGHTHOUSE</text>
  <text x="600" y="128" text-anchor="middle" font-size="14" fill="#D4AF37">Flashy pink &amp; gold · robot livery standard</text>

  <!-- Logo badge large -->
  <g transform="translate(160,180)">
    <circle cx="100" cy="100" r="90" fill="#120816" stroke="#D4AF37" stroke-width="6"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#FF2D95" stroke-width="2"/>
    <rect x="78" y="35" width="44" height="28" rx="3" fill="#D4AF37"/>
    <rect x="84" y="40" width="32" height="18" fill="#FF2D95"/>
    <path d="M72,70 L128,70 L118,145 L82,145 Z" fill="url(#pink)"/>
    <rect x="70" y="145" width="60" height="10" fill="url(#gold)"/>
    <text x="100" y="185" text-anchor="middle" font-size="22" fill="#FF69B4" font-weight="bold">EJL</text>
    <text x="100" y="205" text-anchor="middle" font-size="11" fill="#D4AF37" letter-spacing="2">LIGHTHOUSE</text>
    <text x="100" y="240" text-anchor="middle" font-size="12" fill="#FFE08A">PRIMARY LOGO MARK</text>
    <text x="100" y="258" text-anchor="middle" font-size="10" fill="#FFB6D9">Use on robots · suite plaque · app</text>
  </g>

  <!-- Robot R1 -->
  <g transform="translate(420,200)">
    <rect x="40" y="40" width="160" height="180" rx="20" fill="#2a1524" stroke="#D4AF37" stroke-width="3"/>
    <rect x="60" y="60" width="120" height="70" rx="8" fill="#120816" stroke="#FF2D95"/>
    <!-- logo on face -->
    <circle cx="120" cy="95" r="24" fill="#120816" stroke="#D4AF37" stroke-width="2"/>
    <text x="120" y="92" text-anchor="middle" font-size="11" fill="#FF2D95" font-weight="bold">EJL</text>
    <text x="120" y="104" text-anchor="middle" font-size="5" fill="#D4AF37">LH</text>
    <rect x="70" y="145" width="100" height="40" rx="4" fill="url(#pink)" opacity="0.9"/>
    <text x="120" y="170" text-anchor="middle" font-size="12" fill="#FFE08A" font-weight="bold">TRAY DECK</text>
    <circle cx="70" cy="235" r="16" fill="#120816" stroke="#D4AF37" stroke-width="3"/>
    <circle cx="170" cy="235" r="16" fill="#120816" stroke="#D4AF37" stroke-width="3"/>
    <text x="120" y="280" text-anchor="middle" font-size="14" fill="#FF69B4" font-weight="bold">R1 · INDOOR</text>
    <text x="120" y="300" text-anchor="middle" font-size="11" fill="#D4AF37">Front badge + side wrap</text>
  </g>

  <!-- Robot R2 -->
  <g transform="translate(680,200)">
    <rect x="40" y="40" width="160" height="180" rx="20" fill="#2a1524" stroke="#FF2D95" stroke-width="3"/>
    <rect x="60" y="60" width="120" height="70" rx="8" fill="#120816" stroke="#D4AF37"/>
    <circle cx="120" cy="95" r="24" fill="#120816" stroke="#FF2D95" stroke-width="2"/>
    <text x="120" y="92" text-anchor="middle" font-size="11" fill="#FF2D95" font-weight="bold">EJL</text>
    <text x="120" y="104" text-anchor="middle" font-size="5" fill="#D4AF37">LH</text>
    <rect x="70" y="145" width="100" height="40" rx="4" fill="url(#gold)" opacity="0.95"/>
    <text x="120" y="170" text-anchor="middle" font-size="12" fill="#120816" font-weight="bold">TRAY DECK</text>
    <circle cx="70" cy="235" r="16" fill="#120816" stroke="#FF2D95" stroke-width="3"/>
    <circle cx="170" cy="235" r="16" fill="#120816" stroke="#FF2D95" stroke-width="3"/>
    <text x="120" y="280" text-anchor="middle" font-size="14" fill="#FF69B4" font-weight="bold">R2R4 FLEET</text>
    <text x="120" y="300" text-anchor="middle" font-size="11" fill="#D4AF37">Same livery all units</text>
  </g>

  <!-- Specs -->
  <rect x="100" y="560" width="1000" height="160" fill="#2a1524" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="600" y="595" text-anchor="middle" font-size="14" fill="#FF69B4" font-weight="bold">BRAND APPLICATION RULES</text>
  <text x="140" y="630" font-size="13" fill="#FFE08A">" Colors: Hot pink #FF2D95 / #FF69B4 + metallic gold #D4AF37 on near-black #120816</text>
  <text x="140" y="655" font-size="13" fill="#FFE08A">" Every robot: circular EJL mark on front panel + EJL LIGHTHOUSE gold wordmark on both sides</text>
  <text x="140" y="680" font-size="13" fill="#FFE08A">" Tray liner / napkin sleeve carries mini logo · VIP pass window shows same mark</text>
  <text x="140" y="705" font-size="13" fill="#FFE08A">" No tip jar graphics · optional DONATE QR on robot screen only (charity / house fund)</text>
</svg>
