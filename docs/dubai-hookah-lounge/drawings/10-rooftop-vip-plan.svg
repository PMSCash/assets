<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0d0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1400" height="920" fill="#1a0f16"/>
  <rect x="40" y="40" width="1320" height="780" fill="#2a1524" stroke="#D4AF37" stroke-width="2"/>
  <rect x="40" y="40" width="1320" height="780" fill="url(#grid)" opacity="0.3"/>

  <rect x="40" y="830" width="1320" height="70" fill="#120816"/>
  <text x="60" y="858" fill="#FF69B4" font-size="16" font-weight="bold">EJL LIGHTHOUSE  ROOFTOP VIP-2 (SECOND VIP)</text>
  <text x="60" y="880" fill="#D4AF37" font-size="11">Open-air e-locked terrace suite · pergola · outdoor fireplace · skyline view · robot handoff at pass · no bedroom</text>
  <text x="1220" y="868" fill="#FF69B4" font-size="12">DRAWING A-07</text>

  <!-- stairs/lift -->
  <rect x="60" y="300" width="140" height="220" fill="#3a2034" stroke="#D4AF37"/>
  <text x="130" y="390" text-anchor="middle" font-size="12" fill="#FFE08A" font-weight="bold">STAIRS</text>
  <text x="130" y="410" text-anchor="middle" font-size="12" fill="#FFE08A" font-weight="bold">+ LIFT</text>
  <text x="130" y="435" text-anchor="middle" font-size="9" fill="#FFB6D9">from indoor</text>

  <!-- vestibule -->
  <rect x="200" y="340" width="100" height="140" fill="#4a2840" stroke="#D4AF37" stroke-width="2"/>
  <text x="250" y="390" text-anchor="middle" font-size="11" fill="#FFE08A" font-weight="bold">VESTIBULE</text>
  <rect x="280" y="380" width="16" height="60" fill="#120816" stroke="#FF2D95" stroke-width="2"/>
  <circle cx="288" cy="410" r="4" fill="#2ecc71"/>
  <text x="288" y="370" text-anchor="middle" font-size="8" fill="#FF69B4" font-weight="bold">E-DOOR</text>

  <!-- VIP-2 envelope -->
  <rect x="320" y="80" width="820" height="700" fill="none" stroke="#FF2D95" stroke-width="3"/>
  <text x="730" y="110" text-anchor="middle" font-size="15" fill="#FF69B4" font-weight="bold">ROOFTOP VIP-2 · ~55 m² · ELECTRONICALLY CLOSED</text>
  <text x="730" y="130" text-anchor="middle" font-size="11" fill="#D4AF37">Second VIP add-on · terrace entertainment · 8 seats · pink/gold</text>

  <!-- pergola -->
  <rect x="350" y="150" width="760" height="40" fill="#3a2034" stroke="#D4AF37"/>
  <text x="730" y="175" text-anchor="middle" font-size="12" fill="#FFE08A" font-weight="bold">PERGOLA + REFLECTIVE LINEAR CEILING LIGHTS</text>
  <line x1="380" y1="160" x2="380" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="450" y1="160" x2="450" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="520" y1="160" x2="520" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="590" y1="160" x2="590" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="660" y1="160" x2="660" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="730" y1="160" x2="730" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="800" y1="160" x2="800" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="870" y1="160" x2="870" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="940" y1="160" x2="940" y2="180" stroke="#FF69B4" stroke-width="2"/>
  <line x1="1010" y1="160" x2="1010" y2="180" stroke="#FF69B4" stroke-width="2"/>

  <!-- banquettes -->
  <rect x="370" y="220" width="60" height="280" rx="8" fill="#6a3058" stroke="#D4AF37"/>
  <rect x="980" y="220" width="60" height="280" rx="8" fill="#6a3058" stroke="#D4AF37"/>
  <rect x="480" y="220" width="420" height="50" rx="8" fill="#6a3058" stroke="#D4AF37"/>
  <text x="690" y="250" text-anchor="middle" font-size="12" fill="#FFE08A" font-weight="bold">BANQUETTE · 8 SEATS</text>
  <circle cx="400" cy="260" r="8" fill="#D4AF37"/><circle cx="400" cy="320" r="8" fill="#D4AF37"/>
  <circle cx="400" cy="380" r="8" fill="#D4AF37"/><circle cx="400" cy="440" r="8" fill="#D4AF37"/>
  <circle cx="1010" cy="260" r="8" fill="#D4AF37"/><circle cx="1010" cy="320" r="8" fill="#D4AF37"/>
  <circle cx="1010" cy="380" r="8" fill="#D4AF37"/><circle cx="1010" cy="440" r="8" fill="#D4AF37"/>

  <!-- outdoor fireplace -->
  <rect x="700" y="300" width="90" height="100" fill="#120816" stroke="#D4AF37" stroke-width="2"/>
  <rect x="715" y="320" width="60" height="50" fill="#FF2D95" opacity="0.85"/>
  <text x="745" y="420" text-anchor="middle" font-size="10" fill="#D4AF37" font-weight="bold">OUTDOOR FIREPLACE</text>

  <!-- low table + TV -->
  <ellipse cx="560" cy="360" rx="40" ry="24" fill="#fff0f8" stroke="#D4AF37"/>
  <text x="560" y="365" text-anchor="middle" font-size="8" fill="#2c2416" font-weight="bold">VOD / e-shisha</text>
  <rect x="520" y="200" width="140" height="22" rx="2" fill="#120816" stroke="#D4AF37"/>
  <text x="590" y="215" text-anchor="middle" font-size="8" fill="#FF69B4" font-weight="bold">TV 75" WEATHER</text>

  <!-- skyline rail -->
  <rect x="350" y="540" width="760" height="50" fill="#1a3040" stroke="#7ec8e3"/>
  <text x="730" y="570" text-anchor="middle" font-size="12" fill="#7ec8e3" font-weight="bold">GLASS RAIL · SKYLINE VIEW</text>

  <!-- hostess + pass + WC -->
  <rect x="370" y="620" width="160" height="120" fill="#4a2840" stroke="#FF2D95" stroke-width="2"/>
  <text x="450" y="670" text-anchor="middle" font-size="12" fill="#FF69B4" font-weight="bold">HOSTESS</text>
  <text x="450" y="695" text-anchor="middle" font-size="9" fill="#D4AF37">×2 · no tips</text>

  <rect x="550" y="620" width="140" height="120" fill="#3a3040" stroke="#D4AF37"/>
  <text x="620" y="680" text-anchor="middle" font-size="11" fill="#FFE08A" font-weight="bold">POWDER WC</text>

  <rect x="710" y="620" width="220" height="120" fill="#4a2840" stroke="#D4AF37" stroke-width="2"/>
  <text x="820" y="665" text-anchor="middle" font-size="11" fill="#D4AF37" font-weight="bold">SERVICE PASS</text>
  <text x="820" y="690" text-anchor="middle" font-size="9" fill="#FFB6D9">R4 rooftop robot ’ pass</text>
  <rect x="760" y="705" width="120" height="22" fill="#120816" stroke="#FF2D95"/>
  <text x="820" y="720" text-anchor="middle" font-size="8" fill="#FF69B4">PASS WINDOW</text>

  <rect x="950" y="620" width="160" height="120" fill="#2a1830" stroke="#D4AF37"/>
  <text x="1030" y="670" text-anchor="middle" font-size="11" fill="#FFE08A" font-weight="bold">BAR HANDOFF</text>
  <text x="1030" y="695" text-anchor="middle" font-size="9" fill="#FFB6D9">from dumbwaiter</text>

  <!-- side panel -->
  <rect x="1170" y="80" width="170" height="700" fill="#120816" stroke="#D4AF37"/>
  <text x="1255" y="120" text-anchor="middle" font-size="12" fill="#FF69B4" font-weight="bold">VIP-2 OPS</text>
  <circle cx="1255" cy="165" r="22" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="1255" y="161" text-anchor="middle" font-size="11" fill="#FF2D95" font-weight="bold">EJL</text>
  <text x="1255" y="175" text-anchor="middle" font-size="6" fill="#D4AF37">LIGHTHOUSE</text>
  <text x="1190" y="220" font-size="10" fill="#FFE08A" font-weight="bold">vs Indoor VIP-1</text>
  <text x="1190" y="242" font-size="9" fill="#FFB6D9">" No bedroom/office</text>
  <text x="1190" y="260" font-size="9" fill="#FFB6D9">" Terrace / open air</text>
  <text x="1190" y="278" font-size="9" fill="#FFB6D9">" Weatherproof TV</text>
  <text x="1190" y="296" font-size="9" fill="#FFB6D9">" Outdoor fireplace</text>
  <text x="1190" y="314" font-size="9" fill="#FFB6D9">" Same e-lock rules</text>
  <text x="1190" y="350" font-size="10" fill="#FFE08A" font-weight="bold">Hard rules</text>
  <text x="1190" y="372" font-size="9" fill="#FFB6D9">" E-shisha only</text>
  <text x="1190" y="390" font-size="9" fill="#FFB6D9">" Robots at pass</text>
  <text x="1190" y="408" font-size="9" fill="#FFB6D9">" E-pay · no tips</text>
  <text x="1190" y="426" font-size="9" fill="#FFB6D9">" Panic ’ emerg.</text>
  <text x="1190" y="460" font-size="10" fill="#FFE08A" font-weight="bold">CAPEX add-on</text>
  <text x="1190" y="482" font-size="9" fill="#FFB6D9">350k900k AED</text>
  <text x="1190" y="500" font-size="9" fill="#FFB6D9">incl. e-lock + FF&amp;E</text>
</svg>
