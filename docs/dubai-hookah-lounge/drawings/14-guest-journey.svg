    <text x="160" y="280" text-anchor="middle" font-size="10" fill="#D4AF37">EJL welcome</text>

    <line x1="250" y1="220" x2="300" y2="220" stroke="#D4AF37" stroke-width="3" marker-end="url(#jarr)"/>

    <rect x="310" y="140" width="180" height="160" rx="8" fill="#321828" stroke="#D4AF37" stroke-width="2"/>
