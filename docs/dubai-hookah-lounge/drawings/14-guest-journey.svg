  <text x="1050" y="500" text-anchor="middle" font-size="10" fill="#FFB6D9">E-door re-locks</text>
  <text x="1050" y="525" text-anchor="middle" font-size="10" fill="#FFB6D9">EMS panic available anytime</text>

  <!-- alternate paths -->
  <rect x="70" y="590" width="1240" height="190" fill="#120816" stroke="#D4AF37"/>
  <text x="100" y="625" fill="#FFE08A" font-size="13" font-weight="bold">ALTERNATE PATHS</text>
  <text x="100" y="660" fill="#FFB6D9" font-size="12">A · General guest: Arrive ’ Host ’ Dining / rooftop seat ’ QR order ’ Robot delivery ’ E-pay ’ Donation ’ Depart</text>
  <text x="100" y="690" fill="#FFB6D9" font-size="12">B · Rooftop VIP-2: Arrive ’ Lift/stairs ’ VIP-2 vestibule unlock ’ Terrace experience ’ R4 pass service ’ E-pay ’ Depart</text>
  <text x="100" y="720" fill="#FFB6D9" font-size="12">C · Medical: Any zone panic ’ Staff + emergency room A-05 ’ Stabilize ’ EMS 998 / private ambulance</text>
  <text x="100" y="750" fill="#D4AF37" font-size="12">Hard rule everywhere: strictly electronic · no tipping · robots never enter locked VIP or coal / emergency / staff rooms</text>
</svg>
