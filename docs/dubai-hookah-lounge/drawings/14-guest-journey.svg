  <text x="1220" y="868" fill="#FF69B4" font-size="12">DRAWING G-01</text>

  <text x="700" y="95" text-anchor="middle" font-size="16" fill="#FF69B4" font-weight="bold">PRIMARY PATH · PRINCIPAL VIP-1 BOOKING</text>

