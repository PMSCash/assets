    <text x="400" y="235" text-anchor="middle" font-size="10" fill="#FFB6D9">Dining aisle</text>
    <text x="400" y="255" text-anchor="middle" font-size="10" fill="#FFB6D9">Robot keep-clear</text>
    <text x="400" y="280" text-anchor="middle" font-size="10" fill="#D4AF37">To VIP corridor</text>

    <line x1="490" y1="220" x2="540" y2="220" stroke="#D4AF37" stroke-width="3" marker-end="url(#jarr)"/>

